server {
  listen 80;
  client_max_body_size 40m;                 # phone photos up to ~25 MB each, a few per request

  location /api/ {
    proxy_pass http://api:8000/;            # trailing slash strips the /api prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;
    proxy_buffering off;                    # server-sent events (scan progress) must not be buffered
    proxy_read_timeout 3600s;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }
}
